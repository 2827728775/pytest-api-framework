name: API Tests

# 每次 push 到 main/master，或对任意 PR，自动跑接口自动化测试并生成 Allure 报告
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行 pytest（生成 Allure 结果）
        run: pytest

      - name: 上传 Allure 原始结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure-results
          retention-days: 7

      - name: 安装 Allure 命令行
        if: always()
        run: |
          curl -sL https://github.com/allure-framework/allure2/releases/download/2.27.0/allure-2.27.0.tgz -o allure.tgz
          tar -xzf allure.tgz
          echo "$PWD/allure-2.27.0/bin" >> "$GITHUB_PATH"

      - name: 生成 Allure HTML 报告
        if: always()
        run: allure generate reports/allure-results -o allure-report --clean

      - name: 上传 Allure HTML 报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 7
